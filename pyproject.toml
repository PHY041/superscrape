[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superscrape"
version = "0.1.0"
description = "Web scraping + AI visual intelligence that just works — anti-bot era edition"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Haoyang Pang", email = "haoyang@canmarket.ai"},
]
keywords = ["scraping", "anti-bot", "camoufox", "amazon", "web-scraping", "visual-intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "camoufox>=0.4.0",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "openai>=1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.111.0", "uvicorn[standard]>=0.29.0", "Pillow>=10.0"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
superscrape = "superscrape.cli.main:cli"

[project.urls]
Homepage = "https://github.com/PHY041/superscrape"
Repository = "https://github.com/PHY041/superscrape"
Issues = "https://github.com/PHY041/superscrape/issues"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"superscrape/sites/*.py" = ["E501"]
"superscrape/analyzers/*.py" = ["E501"]
"api/reports/html_builder.py" = ["E501"]
"api/routes/*.py" = ["E501"]
"api/services/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
